name: Windows and Ubuntu synthetic journal verification
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      phase:
        description: Existing controlled row phase
        type: choice
        options: [product-ci, input-graph, input-only]
        default: product-ci
      admission_json:
        description: Exact source/input/host admission template from authorized dispatcher
        type: string
        required: true
      admission_sha256:
        description: SHA256 of exact admission template bytes
        type: string
        required: true
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    name: Guarded native ${{ matrix.rid }}
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'input-graph' && fromJSON('[{"os":"ubuntu-24.04","rid":"linux-x64"}]') || github.event_name == 'workflow_dispatch' && inputs.phase == 'input-only' && fromJSON('[{"os":"windows-2025","rid":"win-x64"}]') || fromJSON('[{"os":"windows-2025","rid":"win-x64"},{"os":"ubuntu-24.04","rid":"linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact typed host fact and own controlled native stages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FRL01_ADMISSION_JSON: ${{ inputs.admission_json }}
          FRL01_ADMISSION_TEMPLATE_SHA256: ${{ inputs.admission_sha256 }}
          FRL01_PHASE: ${{ inputs.phase || 'product-ci' }}
        run: |
          $python = if ($IsWindows) { (Get-Command python -CommandType Application -ErrorAction Stop).Source } else { '/usr/bin/python3' }
          $admission = $env:FRL01_CI_ADMISSION_PATH
          $hash = $env:FRL01_CI_ADMISSION_SHA256
          if ($env:FRL01_ADMISSION_JSON) {
            if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:FRL01_ADMISSION_TEMPLATE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'HOLD: external exact dispatch admission required' }
            $raw = [Text.Encoding]::UTF8.GetBytes($env:FRL01_ADMISSION_JSON)
            if ($raw.Length -gt 60000 -or [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($raw)).ToLowerInvariant() -ne $env:FRL01_ADMISSION_TEMPLATE_SHA256) { throw 'HOLD: admission template identity differs' }
            $mapped = $env:FRL01_ADMISSION_JSON.Replace('<CHECKOUT>', $env:GITHUB_WORKSPACE.Replace('\', '/')).Replace('<TEMP>', $env:RUNNER_TEMP.Replace('\', '/'))
            $admission = Join-Path $env:RUNNER_TEMP ('frl01-external-admission-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.json')
            if (Test-Path -LiteralPath $admission) { throw 'HOLD: admission path already exists' }
            [IO.File]::WriteAllText($admission, $mapped, [Text.UTF8Encoding]::new($false))
            $hash = (Get-FileHash -LiteralPath $admission -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if (-not $admission -or $hash -notmatch '^[0-9a-f]{64}$') { throw 'HOLD: exact external own admission is absent' }
          if ((Get-FileHash -LiteralPath $admission -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'HOLD: own admission hash differs' }
          $profile = if ($IsWindows) { 'tools/ci/PROFILE.win-x64.json' } else { 'tools/ci/PROFILE.json' }
          & $python -I -B tools/ci/ci_host_controller.py --mode $env:FRL01_PHASE --admission $admission --admission-sha256 $hash --profile $profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && inputs.phase != 'input-graph' && inputs.phase != 'input-only'
        with:
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 7 || 3 }}
          name: tested-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/host-proof/*.json
            artifacts/tests/receipt.json
            artifacts/build/archive.json
            artifacts/package checks with spaces/receipt.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify already-executed archives and exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Publish tested preview without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --prerelease --title "$RELEASE_TAG — Financial Reconciliation Ledger" --notes-file docs/RELEASE-v0.1.0-preview.3.md
